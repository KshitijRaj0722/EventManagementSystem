spring.application.name=event-management-system

# Local dev secrets live in the (git-ignored) application-local.properties,
# loaded by the default "local" profile. In production set SPRING_PROFILES_ACTIVE
# (or just supply DB_PASSWORD / JWT_SECRET as environment variables).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ---- Server ----
server.port=${PORT:8081}

# ---- Database ----
# Production default = PostgreSQL, built from parts (Render wires DB_HOST/PORT/NAME).
# Local dev overrides this with a MySQL URL in application-local.properties (local profile).
# The JDBC driver is auto-detected from the URL; both MySQL & PostgreSQL drivers are on the classpath.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eventhubdb}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Connection pool (keep small for free-tier hosts)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-of-at-least-32-bytes}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- CORS (comma-separated origin patterns) ----
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---- Email (JavaMailSender) ----
# Set app.mail.enabled=true and provide SMTP creds to actually send mail.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@eventhub.local}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---- Reminder scheduler (cron) ----
app.reminder.cron=${REMINDER_CRON:0 0 * * * *}

# ---- Actuator ----
management.endpoints.web.exposure.include=health
# Mail is intentionally optional; don't let an unconfigured SMTP server fail the
# health check (which would block the platform health probe from passing).
management.health.mail.enabled=false
