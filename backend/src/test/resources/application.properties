# Test profile: in-memory H2, no real DB or mail required.
spring.datasource.url=jdbc:h2:mem:eventhubtest;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

app.jwt.secret=test-secret-key-that-is-definitely-long-enough-32-bytes
app.jwt.expiration-ms=3600000
app.cors.origins=http://localhost:5173

app.mail.enabled=false
spring.mail.host=localhost
spring.mail.port=25

# Disable the hourly reminder cron during tests.
app.reminder.cron=-
